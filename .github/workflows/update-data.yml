name: Update MTGO Data

on:
  schedule:
    # Run every 8 hours with a 15-minute offset (00:15, 08:15, 16:15 UTC)
    - cron: "15 */8 * * *"
  workflow_dispatch:

concurrency:
  group: update-mtgo-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-data:
    name: Scrape and Update MTGO Data
    runs-on: ubuntu-latest
    if: ${{ vars.USER_AGENT != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.14
        run: uv python install 3.14

      - name: Restore Scryfall bulk data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: scryfall-bulk-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            scryfall-bulk-${{ runner.os }}-

      - name: Run scraper update
        env:
          SCRAPER_SOURCE: "git+https://github.com/davidfischer/modometa-scraper.git"
          USER_AGENT: ${{ vars.USER_AGENT }}
        run: ./scripts/update.sh

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Tournaments/

          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "Update MTGO tournament data [${TIMESTAMP}] [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
